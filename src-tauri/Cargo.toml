[package]
name = "muse-desktop"
version = "0.3.0"
edition = "2021"
description = "Muse Desktop (Tauri/Rust) — jendela muse.ai resmi + bridge lokal aman"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
muse-bridge = { path = "../crates/muse-bridge" }
rand = "0.8"

[profile.release]
opt-level = "s"
lto = true
strip = true
